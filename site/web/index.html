<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arcade</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0d0d0f; color: #d8d8dc; overflow: hidden;
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  #stage { position: fixed; inset: 0 0 28px 0; display: flex; align-items: center; justify-content: center; }
  canvas { background: #000; image-rendering: pixelated; image-rendering: crisp-edges; }
  #overlay { position: fixed; inset: 0 0 28px 0; display: none; flex-direction: column; gap: 6px;
    align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.62); text-align: center; cursor: pointer; }
  #overlay.shown { display: flex; }
  #overlay-title { font-size: 22px; font-weight: 600; color: #fff; }
  #overlay-hint { font-size: 14px; color: #c9c9d1; }
  /* Браузер не дал игре захватить мышь — заметка сверху, игру не закрывает */
  #mouse-note { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); max-width: min(560px, calc(100% - 32px)); display: none;
    padding: 8px 14px; background: rgba(22, 22, 25, 0.92); border: 1px solid #34343a; border-radius: 6px; color: #e8e8ec;
    font-size: 13px; text-align: center; cursor: pointer; z-index: 1000; }
  #mouse-note.shown { display: block; }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; height: 28px; display: flex; align-items: center; gap: 12px;
    padding: 0 10px; background: #161619; color: #9a9aa3; font-size: 12px; white-space: nowrap; overflow: hidden; }
  #bar .grow { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  #bar button { background: #26262b; color: #d8d8dc; border: 1px solid #34343a; border-radius: 4px;
    font: inherit; padding: 2px 8px; cursor: pointer; }
  #bar button:hover, #bar a:hover { background: #303036; }
  #bar a { color: #d8d8dc; text-decoration: none; background: #26262b; border: 1px solid #34343a; border-radius: 4px; padding: 2px 8px; }
  #best { color: #e8c96a; }
  /* Настольные игры: не влезла страница по высоте — она прокручивается, а не обрезается сверху и снизу */
  #board-root { max-height: 100%; overflow-y: auto; box-sizing: border-box; }
  /* Шахматы: запись ходов — под доской и шириной с неё, строкой с переносами; своей прокрутки нет, прокручивается
     страница. Видны последние ходы, кнопка «Показать все» / «Скрыть» — в конце записи */
  .chess-layout { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .chess-moves { width: min(92vw, 62vh, 480px); box-sizing: border-box; padding: 6px 10px; border: 1px solid #3a3a44;
    border-radius: 8px; text-align: left; font: 13px/1.6 ui-monospace, monospace; color: #c9c9cf; }
  .chess-moves .pair { display: inline-block; margin-right: 12px; white-space: nowrap; }
  .chess-all { margin-left: 4px; padding: 0 8px; border: 1px solid #3a3a44; border-radius: 6px; background: #1c1c22;
    color: #9fc3ff; font: 12px/1.6 system-ui, sans-serif; cursor: pointer; }
  .chess-all:hover { background: #26262b; }

  /* Библиотека: показывается, когда в адресе нет ?game=… */
  #library { display: none; max-width: 760px; margin: 0 auto; padding: 22px 20px; height: 100%; box-sizing: border-box; overflow-y: auto; }
  body.library-mode #library { display: block; }
  body.library-mode #stage, body.library-mode #overlay, body.library-mode #bar { display: none; }
  #library .head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  #library .head-actions { display: flex; align-items: center; gap: 10px; }
  #library h1 { margin: 0; font-size: 22px; color: #fff; }
  #library .total { color: #9a9aa3; }
  #library .open-rom { background: #2f3a52; color: #fff; border: 1px solid #4a5c85; border-radius: 6px;
    padding: 6px 12px; font: inherit; cursor: pointer; }
  #library .open-rom:hover, #library .open-rom:focus { background: #3a4968; }
  #library .local-note { margin: -4px 0 14px; color: #9a9aa3; font-size: 12px; }
  #library .local-error { margin: -4px 0 14px; color: #ef8c8c; font-size: 12px; }
  #library .mine-head { margin: 14px 0 4px; color: #9a9aa3; font-size: 12px; }
  #library .card .remove { margin-left: auto; background: none; border: 0; color: #9a9aa3; font: inherit; cursor: pointer; }
  #library .card .remove:hover { color: #ef8c8c; }
  #library .tabs { display: flex; gap: 6px; margin-bottom: 14px; }
  #library .tab { background: #1c1c20; color: #c9c9d1; border: 1px solid #2c2c32; border-radius: 6px; padding: 6px 14px; font: inherit; font-size: 14px; cursor: pointer; }
  #library .tab.active { background: #2f3a52; border-color: #4a5c85; color: #fff; }
  #library .soon { margin-left: 6px; font-size: 11px; color: #9a9aa3; }
  #library .games { display: flex; flex-direction: column; gap: 8px; }
  #library .card { display: block; padding: 12px 14px; background: #17171b; border: 1px solid #26262c; border-radius: 8px; color: inherit; text-decoration: none; outline: none; }
  #library .card:hover, #library .card:focus { border-color: #5b78b8; background: #1b2130; }
  #library .card-top { display: flex; align-items: baseline; gap: 10px; }
  #library .title { font-size: 16px; color: #fff; font-weight: 600; }
  #library .genre { font-size: 12px; color: #9a9aa3; }
  #library .about { margin-top: 4px; color: #c9c9d1; }
  #library .stats { margin-top: 6px; font-size: 12px; color: #e8c96a; }
  #library .empty { padding: 18px; color: #9a9aa3; background: #17171b; border: 1px dashed #2c2c32; border-radius: 8px; }
  #library .hint { margin-top: 14px; font-size: 12px; color: #6f6f78; }
  /* Условия и конфиденциальность — мелкой серой строкой под подсказкой, чтобы не мешали */
  #library .legal { margin-top: 18px; color: #6f6f78; font-size: 12px; }
  #library .legal a { color: #8a8a94; text-decoration: none; }
  #library .legal a:hover, #library .legal a:focus { color: #c9c9d1; text-decoration: underline; }
  /* Полки во вкладке «Игры» — ряд поменьше под вкладками */
  .tabs.shelves { margin-top: -4px; }
  .tab.shelf { font-size: 12px; padding: 4px 12px; opacity: .85; }
  .tab.shelf.active { opacity: 1; }
  /* «Поддержать проект» — скромная ссылка в шапке библиотеки */
  .head-actions .support { font-size: 12px; color: #e0c070; text-decoration: none; margin-right: 8px; white-space: nowrap; }
  .head-actions .support:hover { text-decoration: underline; }
  /* Читалка книг: колонка удобной ширины, тёмная и светлая тема */
  .reader { position: absolute; inset: 0; overflow-y: auto; --reader-size: 19px; }
  .reader.theme-dark { background: #17171c; color: #e8e4da; }
  .reader.theme-light { background: #f7f3ea; color: #23201a; }
  .reader-bar { position: sticky; top: 0; display: flex; gap: 8px; align-items: center; padding: 8px 14px; background: inherit; border-bottom: 1px solid rgba(128,128,128,.25); z-index: 2; font: 13px system-ui, sans-serif; }
  .reader-name { flex: 1; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .reader-progress { opacity: .7; min-width: 3em; text-align: right; }
  .reader-btn { font: inherit; padding: 4px 10px; border-radius: 6px; border: 1px solid rgba(128,128,128,.4); background: transparent; color: inherit; cursor: pointer; }
  .reader-toc { max-width: 38em; margin: 0 auto; padding: 8px 16px; display: flex; flex-direction: column; gap: 2px; }
  .reader-toc[hidden] { display: none; }
  .reader-toc-item { text-align: left; font: 14px system-ui, sans-serif; padding: 6px 8px; border: 0; background: transparent; color: inherit; cursor: pointer; border-radius: 4px; }
  .reader-toc-item:hover { background: rgba(128,128,128,.15); }
  .reader-text { max-width: 38em; margin: 0 auto; padding: 16px 20px 40vh; font: var(--reader-size)/1.6 Georgia, 'Times New Roman', serif; }
  .reader-text p { margin: 0 0 .7em; text-indent: 1.5em; }
  .reader-text p.verse { white-space: pre-line; text-indent: 0; margin-left: 1.5em; }
  .reader-chapter { font: 600 calc(var(--reader-size) * 1.15)/1.3 system-ui, sans-serif; margin: 2em 0 1em; }
  /* Открытая библиотека: язык книг, поиск, разделы и кнопка «Ещё» */
  #library .ol-controls { display: flex; gap: 8px; margin-bottom: 10px; }
  #library .ol-controls input { flex: 1; min-width: 0; background: #17171b; color: #fff; border: 1px solid #2c2c32; border-radius: 6px; padding: 6px 10px; font: inherit; }
  #library .ol-controls input:focus { border-color: #5b78b8; outline: none; }
  #library .tabs.genres { flex-wrap: wrap; }
  #library .ol-more { align-self: center; margin-top: 6px; }
  #library .empty.failed { color: #ef8c8c; }
  /* Книга скачивается и собирается: строка состояния и путь назад, если не вышло */
  .reader-status { max-width: 38em; margin: 18vh auto 0; padding: 0 20px; color: #9a9aa3; font: 15px/1.6 system-ui, sans-serif; text-align: center; }
  .reader-status.failed { color: #e0c070; }
  .reader-back { color: #7fb2ff; }
  /* Заголовок жанра на полке книг */
  .genre-head { font: 600 13px system-ui, sans-serif; text-transform: uppercase; letter-spacing: .06em; opacity: .65; margin: 14px 2px 6px; }
  .genre-head:first-child { margin-top: 2px; }
</style>
</head>
<body>
<input id="local-rom" type="file" accept=".nes" hidden>
<div id="stage"><canvas id="screen" width="256" height="240"></canvas></div>
<div id="overlay"><div id="overlay-title"></div><div id="overlay-hint"></div></div>
<div id="mouse-note" role="status"></div>
<div id="library"></div>
<div id="bar">
  <a id="to-library" href="?" tabindex="-1">← Библиотека</a>
  <span id="keys" class="grow"></span>
  <span id="best"></span>
  <span id="credit"></span>
  <a id="license" href="#" target="_blank" rel="noopener" tabindex="-1">лицензия</a>
  <a id="source" href="#" target="_blank" rel="noopener" tabindex="-1">исходники</a>
  <button id="sound" tabindex="-1"></button>
  <button id="restart" tabindex="-1">Сначала</button>
  <a id="net" href="#" tabindex="-1" hidden>По сети</a>
</div>
<script src="i18n.js"></script>
<script src="jsnes.js"></script>
<script src="mapper28.js"></script>
<script src="stats.js"></script>
<script src="mine.js"></script>
<script src="open-library.js"></script>
<script src="library.js"></script>
<script src="game.js"></script>
<script src="boot.js"></script>
</body>
</html>
