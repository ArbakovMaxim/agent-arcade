<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Arcade · Чаты</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0d0d0f; color: #d8d8dc;
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  /* Чаты из мода: список слева, переписка справа; в узком окне — что-то одно */
  #chat { height: 100%; }
  .app { display: grid; grid-template-columns: 300px minmax(0, 1fr); height: 100%; max-width: 1280px; margin: 0 auto; }
  .side { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid #222228; }
  .top { display: flex; align-items: center; gap: 8px; padding: 12px; border-bottom: 1px solid #222228; }
  .me { flex: 1; min-width: 0; color: #fff; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: #55555d; }
  .dot.on { background: #3fb950; }
  .btn { background: #26262b; border: 1px solid #34343a; border-radius: 6px; padding: 5px 12px; white-space: nowrap; }
  .btn:hover, .btn:focus { background: #303036; outline: none; border-color: #7d5bbe; }
  .btn.main { background: #6441a5; border-color: #6441a5; color: #fff; }
  .btn.main:hover, .btn.main:focus { background: #7552b8; }
  .btn.warn { color: #f0a0a0; }
  .btn:disabled { opacity: .5; cursor: default; }
  .list { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 4px; }
  /* Аватарка — одна из 24 картинок мода или буква на цветном круге; зелёная точка — друг в сети */
  .ava { position: relative; flex: none; display: inline-block; width: 44px; height: 44px; }
  .ava img { display: block; width: 100%; height: 100%; border-radius: 50%; }
  .ava.on::after { content: ''; position: absolute; right: 0; bottom: 0; width: 11px; height: 11px; border-radius: 50%;
    background: #3fb950; border: 2px solid #0d0d0f; }
  .ava.small { width: 32px; height: 32px; }
  .ava.tiny { width: 28px; height: 28px; }
  .item { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; width: 100%; padding: 8px 10px; background: transparent;
    border: 1px solid transparent; border-radius: 8px; text-align: left; }
  .item .ava { grid-row: span 2; }
  .item:hover, .item:focus { background: #17171b; border-color: #26262c; outline: none; }
  .item.active { background: #241d33; border-color: #6441a5; }
  .item .name { color: #fff; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .when { color: #75757e; font-size: 12px; }
  .item .last { color: #9a9aa3; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .when { justify-self: end; }
  .item .badge { grid-column: 3; justify-self: end; min-width: 20px; padding: 0 6px; border-radius: 10px; background: #6441a5; color: #fff; font-size: 12px; text-align: center; }
  .item .badge:empty { display: none; }
  .talk { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .head { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 1px solid #222228; min-height: 34px; }
  .head .title { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .head .name { color: #fff; font-weight: 600; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .head .sub { color: #8a8a93; font-size: 12px; }
  .head .sub.on { color: #3fb950; }
  .head .ava { width: 38px; height: 38px; }
  .back { display: none; }
  .notice { margin: 8px 12px 0; padding: 8px 12px; border-radius: 6px; background: #2b1d1f; color: #f0b0b0; }
  .notice:empty { display: none; }
  .feed { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
  .more { align-self: center; }
  .day { align-self: center; color: #75757e; font-size: 12px; margin: 8px 0 2px; }
  .msg { align-self: flex-start; max-width: min(640px, 80%); padding: 6px 10px; background: #17171b; border: 1px solid #26262c; border-radius: 12px 12px 12px 4px; }
  .msg.mine { align-self: flex-end; background: #2a2340; border-color: #3b2f5c; border-radius: 12px 12px 4px 12px; }
  /* Группа: чужие сообщения подряд от одного человека — его аватарка у последнего, имя — у первого */
  .line { align-self: flex-start; display: flex; align-items: flex-end; gap: 8px; max-width: min(680px, 86%); min-width: 0; }
  .line .msg { max-width: 100%; min-width: 0; }
  .line .gap { flex: none; width: 32px; }
  .msg .who { color: #cbb8f5; font-size: 12px; font-weight: 600; }
  .msg .text { white-space: pre-wrap; overflow-wrap: anywhere; color: #e8e8ec; }
  .msg .text a { color: #b9a2f0; }
  .msg .at { display: block; text-align: right; color: #75757e; font-size: 11px; }
  .msg .tick { margin-left: 3px; color: #b9a2f0; }
  /* Своё сообщение: ⋮ слева от пузыря появляется при наведении — меню «Изменить» и «Удалить», как и по правой кнопке */
  .msg.mine { position: relative; }
  .msg.editing { border-color: #7d5bbe; }
  .msg .dots { position: absolute; right: 100%; top: 50%; transform: translateY(-50%); margin-right: 2px; padding: 2px 6px; background: transparent; border: 0; border-radius: 6px; color: #75757e; font-size: 16px; line-height: 1; opacity: 0; }
  .msg:hover .dots, .msg:focus-within .dots, .msg.open .dots, .msg .dots:focus { opacity: 1; }
  .msg .dots:hover, .msg .dots:focus { color: #d8d8dc; background: #1c1c21; outline: none; }
  @media (hover: none) { .msg .dots { opacity: .7; } }
  .menu { position: fixed; z-index: 10; min-width: 160px; padding: 4px; display: flex; flex-direction: column; background: #1c1c21; border: 1px solid #34343a; border-radius: 8px; box-shadow: 0 8px 24px rgba(0, 0, 0, .5); }
  .menu:empty { display: none; }
  .menu .ask { padding: 6px 10px 4px; color: #9a9aa3; font-size: 12px; }
  /* Тихие кнопки-надписи: пункты меню и «Отмена» правки */
  .act { padding: 6px 10px; text-align: left; background: transparent; border: 0; border-radius: 6px; }
  .act:hover, .act:focus { background: #26262b; outline: none; }
  .act.warn { color: #f0a0a0; }
  /* Над полем ввода во время правки: что правим и «Отмена» */
  .editing:not(.msg) { display: flex; align-items: center; gap: 8px; padding: 6px 12px 0; border-top: 1px solid #222228; font-size: 12px; }
  .editing:not(.msg) + .compose { border-top: 0; }
  .editing .what { flex: none; color: #b9a2f0; }
  .editing .was { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #8a8a93; }
  .editing .act { padding: 2px 8px; color: #9a9aa3; }
  .note { align-self: center; color: #8a8a93; font-size: 12px; text-align: center; }
  .compose { display: flex; gap: 8px; align-items: flex-end; padding: 10px 12px; border-top: 1px solid #222228; }
  .compose textarea { flex: 1; min-height: 38px; max-height: 160px; resize: vertical; padding: 8px 10px; background: #17171b; border: 1px solid #2c2c32; border-radius: 8px; }
  .compose textarea:focus { outline: none; border-color: #6441a5; }
  /* Под полем ввода: переписка хранится открытым текстом */
  .plain { padding: 0 12px 10px; color: #75757e; font-size: 12px; }
  .left { color: #8a8a93; font-size: 12px; }
  .left:empty { display: none; }
  .sheet { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; max-width: 560px; }
  .sheet h2 { margin: 0; font-size: 16px; color: #fff; }
  .sheet p { margin: 0; color: #9a9aa3; }
  .sheet input[type=text] { padding: 7px 10px; background: #17171b; border: 1px solid #2c2c32; border-radius: 6px; }
  .row { display: flex; align-items: center; gap: 10px; padding: 6px 8px; background: #17171b; border: 1px solid #26262c; border-radius: 8px; }
  .row .person { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .mark { color: #8a8a93; font-size: 12px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  /* Картинка группы: 24 готовые, выбирает тот, кто управляет группой */
  .pics { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 6px; }
  .pick { padding: 2px; background: transparent; border: 2px solid transparent; border-radius: 50%; }
  .pick:hover, .pick:focus { border-color: #34343a; outline: none; }
  .pick.active { border-color: #7d5bbe; }
  .pick .ava { width: 100%; height: auto; aspect-ratio: 1; }
  .empty { max-width: 560px; margin: 40px auto; padding: 18px; color: #9a9aa3; background: #17171b; border: 1px dashed #2c2c32; border-radius: 8px; }
  .hint { margin: auto; padding: 24px; color: #75757e; text-align: center; }
  @media (max-width: 720px) {
    .app { grid-template-columns: minmax(0, 1fr); }
    .app.open .side { display: none; }
    .app:not(.open) .talk { display: none; }
    .back { display: inline-block; }
    .side { border-right: 0; }
  }
</style>
</head>
<body>
<div id="chat"></div>
<script src="i18n.js"></script>
<script src="avatars.js"></script>
<script src="chat.js"></script>
</body>
</html>
