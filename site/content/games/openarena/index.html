<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenArena</title>
<!-- Страница Arcade для OpenArena: движок ioquake3 (engine/), данные — pk3 из архива OpenArena, запуск — arcade-start.js -->
<style>
html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
canvas { display: block; width: 100%; height: 100%; object-fit: contain; outline: none; }
#loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: #d8d8d8; font: 15px/1.4 system-ui, sans-serif; text-align: center; padding: 16px; box-sizing: border-box; }
#loading[hidden] { display: none; }
#loading.failed { color: #ff8a80; }
#bar { width: min(380px, 80vw); height: 6px; background: #2a2a2a; border-radius: 3px; overflow: hidden; }
#bar > div { height: 100%; width: 0; background: #e8a33c; transition: width .2s; }
#loading.failed #bar { display: none; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
<div id="loading"><div id="status">Loading OpenArena…</div><div id="bar"><div></div></div></div>
<script src="arcade-pause.js"></script>
<script type="module" src="arcade-start.js"></script>
</body>
</html>
